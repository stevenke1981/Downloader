name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format GUI
        run: cargo fmt -p downloader --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: dlx smoke test
        shell: bash
        run: |
          B=target/release/dlx
          $B --version
          $B --help >/dev/null
      - name: GUI screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/win-screenshot.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-gui-screenshot
          path: win-screenshot.png
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Installer smoke test (silent install / uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: downloader-setup-windows-x64
          path: dist/downloader-setup-windows-x64.exe
      - name: Validate app Info.plist
        if: runner.os == 'macOS'
        run: plutil -lint scripts/Info.plist
