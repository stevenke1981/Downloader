name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format GUI
        run: cargo fmt -p downloader --check
      - name: Lint
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: dlx smoke test
        shell: bash
        run: |
          B=target/release/dlx
          $B --version
          $B --help >/dev/null
      - name: GUI screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/win-screenshot.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-gui-screenshot
          path: |
            win-screenshot.png
            win-screenshot.json
      - name: Small-window layout fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $build = cargo test --release --locked -p downloader --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate GUI test executable' }
          $testExe = $build | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'downloader' } |
            Select-Object -ExpandProperty executable -Last 1
          if (!$testExe) { throw 'GUI test executable missing' }
          foreach ($scene in @('details', 'details-scrolled', 'settings', 'settings-scrolled')) {
            $env:DOWNLOADER_UI_FIXTURE = $scene
            ./scripts/win-screenshot.ps1 -Exe $testExe -Out "win-layout-$scene.png" -Arguments @('--exact', 'lifecycle_tests::render_layout_fixture', '--ignored', '--nocapture')
          }
          Remove-Item Env:DOWNLOADER_UI_FIXTURE
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-small-window-layout
          path: |
            win-layout-*.png
            win-layout-*.json
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Installer smoke test (silent install / uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: downloader-setup-windows-x64
          path: dist/downloader-setup-windows-x64.exe
      - name: Validate app Info.plist
        if: runner.os == 'macOS'
        run: plutil -lint scripts/Info.plist
