[package]
name = "downloader-core"
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
name = "dlcore"
path = "src/lib.rs"

[[bin]]
name = "dlx"
path = "src/bin/dlx.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
