[package]
name = "downloader-core"
version = "0.5.2"
edition = "2024"
license = "MIT"

[lib]
name = "dlcore"
path = "src/lib.rs"

[[bin]]
name = "dlx"
path = "src/bin/dlx.rs"

[[bin]]
name = "downloader-host"
path = "src/bin/host.rs"

[[bin]]
name = "dlxctl"
path = "src/bin/dlxctl.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
blake2 = "0.10"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }

roxmltree = "0.21"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
retina = { version = "=0.4.20", default-features = false }
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
scraper = { version = "=0.24.0", default-features = false }

[dev-dependencies]
tempfile = "3"
